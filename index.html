<!DOCTYPE html>
<html lang="th" data-theme="orange">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f26a2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jadwal Kuliah — Semester Gasal</title>
<style>
:root{
  color-scheme:light;
  --bg:#f26a2d;--ink:#0d0d0d;
  --hair:rgba(13,13,13,.28);
  --glow:rgba(255,246,235,.95);--glow-soft:rgba(255,255,255,.28);
  --sans:"Helvetica Neue",Helvetica,Arial,"Noto Sans Thai","Sarabun",Thonburi,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d;--ink:#f26a2d;
  --hair:rgba(242,106,45,.32);
  --glow:rgba(242,106,45,.85);--glow-soft:rgba(242,106,45,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.4;min-height:100vh;min-height:100dvh;overflow-x:hidden;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;border-radius:0}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.shell{max-width:760px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 18px calc(120px + env(safe-area-inset-bottom))}

/* ---------- top bar ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.today-label{display:flex;align-items:center;gap:8px;font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.today-label:before{content:"";width:8px;height:8px;background:var(--ink);animation:blink 1.6s steps(2,jump-none) infinite}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;border:1.5px solid var(--ink)}
.icon-btn:active{background:var(--ink);color:var(--bg)}
.icon-btn svg{width:17px;height:17px}

/* ---------- poster grid (shared) ---------- */
.row{display:grid;grid-template-columns:70px minmax(0,1fr)}
.when{padding:14px 8px 14px 0;font-weight:800;font-size:.98rem;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.what{border-left:1px solid currentColor;padding:14px 4px 14px 14px;min-width:0}
.name{font-weight:800;font-size:1rem;letter-spacing:-.005em;text-transform:uppercase;line-height:1.2}
.small{font-size:.72rem;line-height:1.45;margin-top:4px;opacity:.85}
.name+.small{margin-top:6px}

/* ---------- header block ---------- */
.head .when{font-size:2.9rem;line-height:.92;letter-spacing:-.05em;padding-top:2px}
.head .when span{display:block}
.head .what{padding-top:6px}
.head .name{font-size:1.05rem;letter-spacing:.02em}
.head{margin-bottom:34px}

/* ---------- day view ---------- */
.day-view{animation:rise .4s both}
.day-banner{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-top:3px solid var(--ink);padding-top:14px;margin-bottom:6px}
.day-name{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-weight:850;font-size:clamp(2rem,10vw,2.9rem);letter-spacing:-.05em;text-transform:uppercase;line-height:.95}
.day-name small{font-size:.8rem;font-weight:500;letter-spacing:0;text-transform:none}
.chip-today{font-size:.62rem;font-weight:800;letter-spacing:.1em;padding:4px 8px;background:var(--ink);color:var(--bg);letter-spacing:.06em}
.day-count{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:right;white-space:nowrap;padding-bottom:3px}
.course-list{margin-top:10px}
.course{animation:rise .45s both;animation-delay:calc(var(--i,0)*70ms)}
.course .when{padding-left:0}
.empty-state{border:1.5px dashed var(--ink);padding:30px 18px;text-align:center;margin-top:14px}
.empty-state strong{display:block;font-size:1.05rem;text-transform:uppercase;margin-bottom:6px}

/* ---------- live: inverted block + glow ---------- */
.course.is-live{background:var(--ink);color:var(--bg);animation:rise .45s both,glow 2.4s ease-in-out .6s infinite;position:relative;z-index:1}
.course.is-live .when{padding-left:10px}
.course.is-live .what{padding-right:10px}
.witem.is-live{background:var(--ink);color:var(--bg);animation:glow 2.4s ease-in-out infinite;position:relative;z-index:1}

/* ---------- week view ---------- */
.week-wrap{display:none;animation:rise .4s both}
.wd{display:grid;grid-template-columns:70px minmax(0,1fr);border-top:3px solid var(--ink)}
.wd-label{padding:14px 8px 14px 0}
.wd-label b{display:inline-block;font-size:1.05rem;font-weight:850;letter-spacing:-.01em;text-transform:uppercase}
.wd-label small{display:block;font-size:.68rem;margin-top:3px;opacity:.85}
.wd.is-today .wd-label b{background:var(--ink);color:var(--bg);padding:1px 6px;margin-left:-0px}
.wd-items{border-left:1px solid var(--ink);min-width:0}
.witem{padding:13px 10px 13px 14px}
.witem+.witem{border-top:1px solid var(--hair)}
.witem .wt{font-weight:800;font-size:.8rem;font-variant-numeric:tabular-nums;margin-bottom:3px}
.witem.is-live+.witem,.witem+.witem.is-live{border-top-color:transparent}
.week-empty{padding:14px;font-size:.8rem;opacity:.85}

/* ---------- title block (bottom, like the poster) ---------- */
.titleblock{margin-top:54px;border-top:3px solid var(--ink);padding-top:22px}
.big{font-weight:850;font-size:clamp(5rem,27vw,10.5rem);line-height:.8;letter-spacing:-.055em;margin:0 0 14px -.02em;text-transform:lowercase}
.sub{font-size:.95rem;font-weight:300;letter-spacing:.32em;text-transform:uppercase}
.sub2{margin-top:6px;font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.photo{margin:0}
.photo img{display:block;width:100%;height:auto;border:1.5px solid var(--ink)}
.photo figcaption{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.photo figcaption span:last-child{font-weight:500;text-align:right;opacity:.85}
.credit{display:flex;justify-content:space-between;gap:16px;margin-top:34px;padding-top:12px;border-top:1px solid var(--hair);font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.credit span+span{text-align:right;font-weight:500}

/* ---------- bottom dock ---------- */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;width:min(calc(100% - 24px),460px);display:grid;grid-template-columns:repeat(6,1fr);padding:4px;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 0 8px;transition:background .2s,color .2s}
.tab .d{font-size:.74rem;font-weight:850;letter-spacing:.06em;text-transform:uppercase}
.tab .t{font-size:.56rem;opacity:.8;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab.is-today:after{content:"";position:absolute;top:5px;right:8px;width:5px;height:5px;background:currentColor}
.tab:active{opacity:.7}

/* ---------- keyframes ---------- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 transparent,0 0 12px var(--glow-soft)}50%{box-shadow:0 0 0 2px var(--glow),0 0 34px var(--glow)}}

@media(max-width:380px){
  .row,.wd{grid-template-columns:58px minmax(0,1fr)}
  .head .when{font-size:2.5rem}
  .name{font-size:.92rem}
  .tab .t{font-size:.52rem}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

/* ---------- time helpers ---------- */
const fmt=t=>t.replace(':','.');
const toMin=t=>{const[a,b]=t.split(':');return +a*60+ +b};
function getNow(){
 // ทดสอบ: เปิดไฟล์ด้วย ?now=1,10:30  (1=จันทร์ … 5=ศุกร์, ตามด้วยเวลา)
 const q=new URLSearchParams(location.search).get('now');
 if(q){const[d,t]=q.split(',');const[h,mi]=t.split(':');return{dow:+d,m:+h*60+ +mi+.5}}
 const n=new Date();return{dow:n.getDay(),m:n.getHours()*60+n.getMinutes()+n.getSeconds()/60};
}
const realDow=getNow().dow;
const todayId=realDow>=1&&realDow<=5?DAYS[realDow-1].id:null;
let currentView=todayId||"Senin";

/* ---------- render ---------- */
const tabs=document.getElementById('tabs'),dayView=document.getElementById('dayView'),weekView=document.getElementById('weekView'),weekGrid=document.getElementById('weekGrid');
document.getElementById('todayLabel').textContent=new Intl.DateTimeFormat('en',{weekday:'short',month:'short',day:'numeric'}).format(new Date());
document.getElementById('statToday').textContent=todayId?COURSES.filter(c=>c.d===todayId).length:0;

function courseCard(c,i){return `<article class="row course" style="--i:${i}" data-d="${c.d}" data-s="${c.s}" data-e="${c.e}"><div class="when">${fmt(c.s)}</div><div class="what"><div class="name">${c.name}</div><div class="small">${c.lec}</div><div class="small">${c.code} · ${c.sks} SKS · s/d ${fmt(c.e)}</div></div></article>`}

function renderTabs(){
 tabs.innerHTML=DAYS.map(d=>`<button class="tab${d.id===todayId?' is-today':''}" role="tab" aria-selected="${currentView===d.id}" data-view="${d.id}"><span class="d">${d.s}</span><span class="t">${d.t}</span></button>`).join('')+
 `<button class="tab" role="tab" aria-selected="${currentView==='all'}" data-view="all"><span class="d">Week</span><span class="t">สัปดาห์</span></button>`;
}
function renderDay(id){
 const d=DAYS.find(x=>x.id===id),courses=COURSES.filter(c=>c.d===id);
 dayView.innerHTML=`<div class="day-banner"><div class="day-name">${d.id}<small>${d.th}</small>${d.id===todayId?'<span class="chip-today">วันนี้</span>':''}</div><div class="day-count">${String(courses.length).padStart(2,'0')} kelas<br>${courses.reduce((n,c)=>n+c.sks,0)} SKS</div></div>`+
 (courses.length?`<div class="course-list">${courses.map(courseCard).join('')}</div>`:`<div class="empty-state"><strong>วันนี้ไม่มีตารางเรียน</strong>ใช้เวลาว่างให้คุ้มค่า แล้วกลับมาอย่างเต็มพลัง</div>`);
 dayView.style.display='block';weekView.style.display='none';
}
function renderWeek(){
 weekGrid.innerHTML=DAYS.map(d=>{const cs=COURSES.filter(c=>c.d===d.id);
  return `<section class="wd${d.id===todayId?' is-today':''}"><div class="wd-label"><b>${d.s}</b><small>${d.th}</small></div><div class="wd-items">${cs.length?cs.map(c=>`<article class="witem" data-d="${c.d}" data-s="${c.s}" data-e="${c.e}"><div class="wt">${fmt(c.s)}–${fmt(c.e)}</div><div class="name">${c.name}</div><div class="small">${c.code} · ${c.sks} SKS</div></article>`).join(''):'<div class="week-empty">ว่างทั้งวัน</div>'}</div></section>`}).join('');
 dayView.style.display='none';weekView.style.display='block';
}

/* ---------- live highlight ---------- */
const LEAD_MIN=60; // ไฮไลท์ล่วงหน้ากี่นาทีก่อนเริ่มเรียน (แก้ตัวเลขนี้ได้)
function updateLive(){
 const{dow,m}=getNow(),today=dow>=1&&dow<=5?DAYS[dow-1].id:null;
 document.querySelectorAll('[data-s]').forEach(el=>{
  const live=el.dataset.d===today&&m>=toMin(el.dataset.s)-LEAD_MIN&&m<toMin(el.dataset.e);
  el.classList.toggle('is-live',live);
 });
}

function show(view){currentView=view;renderTabs();if(view==='all')renderWeek();else renderDay(view);updateLive()}
tabs.addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b)show(b.dataset.view)});

/* ---------- theme (remembered on this device) ---------- */
function setTheme(t){document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#0d0d0d':'#f26a2d'}
try{const saved=localStorage.getItem('jadwal-theme-v2');if(saved==='dark'||saved==='orange')setTheme(saved)}catch(e){}
document.getElementById('themeToggle').addEventListener('click',()=>{
 const next=document.documentElement.dataset.theme==='dark'?'orange':'dark';setTheme(next);
 try{localStorage.setItem('jadwal-theme-v2',next)}catch(e){}
});

show(currentView);
setInterval(updateLive,15000);
</script>
